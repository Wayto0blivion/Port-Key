# Port-Key: a browser-based SSH connection manager, for Docker Desktop on Windows (WSL2 backend).
# This file is all you need. Put it in an empty folder, open PowerShell there and run:
#
#   docker compose up -d            downloads the image and starts Port-Key
#   docker compose logs portkey     shows the one-time setup code for the first visit
#
# then open http://localhost:8822 (only this PC can reach it). Update: `docker compose pull`,
# then `docker compose up -d`. Help: https://github.com/Wayto0blivion/Port-Key
#
# Mounts:
#   %USERPROFILE%\.ssh            -> /ssh             read-only; Port-Key never edits your files
#   %USERPROFILE%\.ssh\port-key   -> /keys-generated  keys generated in Port-Key (create-only); Docker
#                                                     makes the folder on first start
#   named volume portkey-data     -> /data            SQLite database (never on a Windows bind mount);
#                                                     Docker names it portkey_portkey-data
#
# Settings go in a file named .env next to this one (compose reads it on every run):
#   PORTKEY_VERSION=0.1.0           stay on one release instead of the newest (default: latest)
#   PORTKEY_SSH_DIR=D:\keys\.ssh    use a different .ssh folder
#
# Building from source instead of downloading the image: compose.build.yaml in the repository.
name: portkey

services:
  portkey:
    image: ghcr.io/wayto0blivion/port-key:${PORTKEY_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8822:8000"
    environment:
      PORTKEY_PUBLIC_PORT: "8822"
      # Shown in the UI instead of container paths.
      PORTKEY_SSH_DIR_DISPLAY: "${PORTKEY_SSH_DIR:-${USERPROFILE}/.ssh}"
      PORTKEY_KEYS_DIR_DISPLAY: "${USERPROFILE}/.ssh/port-key"
    volumes:
      - type: bind
        source: "${PORTKEY_SSH_DIR:-${USERPROFILE}/.ssh}"
        target: /ssh
        read_only: true
      - type: bind
        source: "${USERPROFILE}/.ssh/port-key"
        target: /keys-generated
        bind:
          create_host_path: true
      - type: volume
        source: portkey-data
        target: /data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A runaway Port-Key can use at most this much, never all of the Docker Desktop VM. Idle it
    # needs under 100 MB; 32 busy terminal sessions stay under about 200 MB.
    mem_limit: 1g
    pids_limit: 256
    # Names that resolve only in the Windows hosts file (or MagicDNS) may not resolve inside the
    # container. Add them here; Diagnostics > "Check a host" shows what the container sees.
    # extra_hosts:
    #   - "build-box:192.168.10.20"

volumes:
  portkey-data:
