# Development and test services. Always run through the Makefile, which passes a project name:
#
#   make check P=portkey-wp3
#
# Nothing here publishes a port on the host; services talk over private compose networks.
# The source tree is bind-mounted at /src, so code changes need no image rebuild.
#
# Services marked "package 7" are placeholders that the test-infrastructure package completes.

x-dev: &dev
  build:
    context: .
    target: dev
  image: portkey-dev:local
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /src
  volumes:
    - ./:/src
  tmpfs:
    - /tmp:exec,mode=1777
  networks:
    - outer

services:
  # pytest, ruff and mypy.
  test:
    <<: *dev

  # Integration runner (package 7): pytest against the sshd containers. It is on the outer
  # network only, so sshd-inner is reachable just by jumping through sshd.
  integration:
    <<: *dev
    profiles: ["integration"]
    command: ["pytest", "tests/integration", "-m", "integration"]
    depends_on:
      sshd:
        condition: service_healthy
      sshd-rekeyed:
        condition: service_healthy
      sshd-inner:
        condition: service_healthy

  # eslint and tsc --checkJs on portkey/static/js.
  lint-js:
    build:
      context: tools/lint-js
    image: portkey-lint-js:local
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    read_only: true
    volumes:
      - ./:/src:ro
    tmpfs:
      - /tmp
    network_mode: none

  # Frontend shell tests (tests/frontend, packages 8a and 8b): Chromium against portkey/static
  # and a mock API, in the same Playwright image as e2e. No network at all.
  frontend:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    image: portkey-e2e:local
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    environment:
      HOME: /tmp
    volumes:
      - ./:/src
    tmpfs:
      - /tmp:exec,mode=1777
    shm_size: "1gb"
    network_mode: none
    command: ["pytest", "tests/frontend", "-p", "no:cacheprovider"]

  # Package 7: TEST-ONLY sshd (Ubuntu 24.04, OpenSSH, pam_google_authenticator, fish) with the
  # users in tests/fixtures/testbed.py; host key set A; ports 22 and 2222. On both networks,
  # so it is the jump host to sshd-inner.
  sshd:
    profiles: ["integration", "e2e"]
    build:
      context: tests/sshd
      additional_contexts:
        fixtures: tests/fixtures/TEST-ONLY/sshd
    image: portkey-sshd:local
    environment:
      HOSTKEY_SET: "a"
    networks:
      - outer
      - inner

  # Package 7: same users as sshd, host key set B (changed-key tests).
  sshd-rekeyed:
    profiles: ["integration", "e2e"]
    image: portkey-sshd:local
    pull_policy: never
    environment:
      HOSTKEY_SET: "b"
    networks:
      - outer

  # Package 7: on the internal network only; reachable just through sshd (jump-host tests).
  sshd-inner:
    profiles: ["integration", "e2e"]
    image: portkey-sshd:local
    pull_policy: never
    environment:
      HOSTKEY_SET: "a"
    networks:
      - inner

  # The real runtime image against the TEST-ONLY fixture .ssh directory. A Windows bind mount
  # shows every file as 0777, so the fixture is copied into a tmpfs and opened up to 0777
  # before the app starts (the copy is per container, so parallel runs do not collide).
  # It runs with the PC's own Host/Origin allowlist (localhost:8822 and friends) and listens on
  # 8822, so the e2e browser opens http://localhost:8822 exactly as the owner's browser does
  # (a secure context, the real ws:// origin) with "localhost" mapped to this container.
  app:
    profiles: ["e2e"]
    build:
      context: .
      target: runtime
    image: portkey:local
    environment:
      PORTKEY_PUBLIC_PORT: "8822"
      PORTKEY_LISTEN_PORT: "8822"
      PORTKEY_SSH_DIR_DISPLAY: 'C:\Users\john\.ssh'
      PORTKEY_KEYS_DIR_DISPLAY: 'C:\Users\john\.ssh\port-key'
    command:
      - sh
      - -c
      - cp -R /fixture-ssh/. /ssh/ && chmod -R 0777 /ssh && exec python -m portkey
    volumes:
      - ./tests/fixtures/TEST-ONLY/ssh:/fixture-ssh:ro
    tmpfs:
      - /ssh:uid=1000,gid=1000,mode=0777
      - /data:uid=1000,gid=1000,mode=0700
      - /keys-generated:uid=1000,gid=1000
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "portkey.healthcheck"]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 15
    networks:
      - outer
    depends_on:
      sshd:
        condition: service_healthy
      sshd-rekeyed:
        condition: service_healthy
      sshd-inner:
        condition: service_healthy

  # Package 7: a static page on another origin that tries to open the app's WebSocket.
  evil-origin:
    profiles: ["e2e"]
    build:
      context: tests/evil-origin
    image: portkey-evil-origin:local
    networks:
      - outer

  # Package 7 harness, package 9 specs: Playwright for Python, Chromium.
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    image: portkey-e2e:local
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    environment:
      # What the browser and the API client use (the PC's URL), and where that really is.
      PORTKEY_BASE_URL: "http://localhost:8822"
      PORTKEY_CONNECT_TO: "app:8822"
      PORTKEY_EVIL_URL: "http://evil-origin:8080"
      HOME: /tmp
    volumes:
      - ./:/src
    tmpfs:
      - /tmp:exec,mode=1777
    shm_size: "1gb"
    command: ["pytest", "tests/e2e", "-m", "e2e", "-p", "no:cacheprovider"]
    networks:
      - outer
    depends_on:
      app:
        condition: service_healthy
      evil-origin:
        condition: service_started

networks:
  outer: {}
  inner:
    internal: true
