<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Port-Key terminal session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#58a6ff}a:hover{color:#79c0ff}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0d1117; color: #c9d1d9; font-family: system-ui, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.45">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; box-sizing: border-box; background: #161b22; border-bottom: 1px solid #30363d">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 3px; font-size: 16px; font-weight: 700; color: #e6edf3; text-decoration: none; letter-spacing: -0.01em">Port<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="12" r="3.5"></circle><path d="M10.5 12H21M17 12v3.5M20.5 12v2.5"></path></svg>Key</a>
<a href="Palette.dc.html" style="flex: 1 1 240px; max-width: 460px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; padding: 0 12px; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #8b949e; text-decoration: none">
<span>Connect to…</span>
<span style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 1px 6px; border: 1px solid #30363d; border-radius: 4px">Ctrl+Shift+K</span>
</a>
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; color: #e3b341; font-size: 12px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>1 key unlocked</span>
<button type="button" style="height: 28px; padding: 0 10px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit; font-size: 12px">Lock</button>
<a href="Keys.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 6px; color: #c9d1d9; text-decoration: none">Keys</a>
<button type="button" style="height: 32px; padding: 0 10px; background: transparent; border: 0; border-radius: 6px; color: #c9d1d9; font: inherit">Settings</button>
</div>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">

<nav aria-label="Connections" style="flex: 1 1 280px; max-width: 100%; display: flex; flex-direction: column; background: #161b22; border-right: 1px solid #30363d">
<div style="padding: 12px">
<input aria-label="Filter connections" placeholder="Filter connections" style="width: 100%; height: 32px; padding: 0 10px; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit">
</div>
<div style="flex: 1; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<sc-if value="{{r.isHead}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; padding: 12px 12px 4px 15px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8b949e"><span>{{r.label}}</span><span>{{r.count}}</span></div>
</sc-if>
<sc-if value="{{r.isHost}}" hint-placeholder-val="{{ true }}">
<a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding-right: 12px; background: {{r.bg}}; color: #c9d1d9; text-decoration: none">
<span style="width: 3px; align-self: stretch; background: {{r.color}}"></span>
<span style="width: 8px; height: 8px; flex: none; border-radius: 50%; box-sizing: border-box; border: 2px solid {{r.dot}}; background: {{r.dotFill}}"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600; color: #e6edf3">{{r.name}}</span>
<span style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.addr}}</span>
</span>
<sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 18px; padding: 0 5px; box-sizing: border-box; text-align: center; border-radius: 9px; background: #1f6feb; color: #ffffff; font-size: 11px; font-weight: 600">{{r.open}}</span>
</sc-if>
<sc-if value="{{r.key}}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="Signs in with a key" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="12" r="3.5"></circle><path d="M10.5 12H21M17 12v3.5M20.5 12v2.5"></path></svg>
</sc-if>
<sc-if value="{{r.pw}}" hint-placeholder-val="{{ false }}">
<span style="padding: 0 5px; border: 1px solid #484f58; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #8b949e">pw</span>
</sc-if>
</a>
</sc-if>
</sc-for>
<button type="button" style="display: flex; justify-content: space-between; margin-top: 8px; padding: 10px 12px 10px 15px; background: transparent; border: 0; border-top: 1px solid #30363d; color: #8b949e; font: inherit; font-size: 12px; text-align: left"><span>Suggested from known_hosts</span><span>14</span></button>
</div>
<div style="padding: 12px; border-top: 1px solid #30363d">
<a href="Wizard-1-Host.dc.html" style="display: flex; align-items: center; justify-content: center; height: 36px; background: #1f6feb; border-radius: 6px; color: #ffffff; font-weight: 600; text-decoration: none">Add connection</a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: flex-end; gap: 2px; padding: 6px 8px 0; overflow-x: auto; background: #161b22; border-bottom: 1px solid #30363d">
<a href="Main.dc.html" aria-label="Home" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 6px 6px 0 0; color: #8b949e"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg></a>
<a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; margin-bottom: -1px; background: #0d1117; border: 1px solid #30363d; border-top: 2px solid #f85149; border-bottom-color: #0d1117; border-radius: 6px 6px 0 0; color: #e6edf3; text-decoration: none; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3fb950"></span><span>web-prod</span><span aria-hidden="true" style="color: #8b949e">×</span></a>
<a href="Terminal.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-top: 2px solid #f85149; border-radius: 6px 6px 0 0; color: #8b949e; text-decoration: none; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3fb950"></span><span>web-prod · 2</span><span style="width: 6px; height: 6px; border-radius: 50%; background: #58a6ff" role="img" aria-label="New output"></span></a>
<a href="Disconnected.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-top: 2px solid #d29922; border-radius: 6px 6px 0 0; color: #8b949e; text-decoration: none; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 2px solid #6e7681"></span><span>imaging-01</span></a>
<a href="Keys.dc.html" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-top: 2px solid transparent; color: #8b949e; text-decoration: none">Keys</a>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 36px; padding: 4px 12px; box-sizing: border-box; border-bottom: 1px solid #30363d">
<span style="display: flex; align-items: center; gap: 8px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; color: #e6edf3"><span style="width: 10px; height: 10px; border-radius: 3px; background: #f85149"></span>john@web-prod</span>
<span style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; color: #8b949e">192.168.10.42:22</span>
<span style="display: flex; align-items: center; gap: 5px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; color: #e3b341"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="12" r="3.5"></circle><path d="M10.5 12H21M17 12v3.5M20.5 12v2.5"></path></svg>id_ed25519</span>
<span style="font-size: 12px; color: #8b949e">Connected 12 min</span>
<div style="display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto">
<button type="button" style="height: 28px; padding: 0 10px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit; font-size: 12px">Find</button>
<button type="button" style="height: 28px; padding: 0 10px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit; font-size: 12px">Copy ssh command</button>
<button type="button" aria-label="Smaller text" style="height: 28px; width: 32px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit; font-size: 12px">A−</button>
<button type="button" aria-label="Larger text" style="height: 28px; width: 32px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit; font-size: 12px">A+</button>
<button type="button" style="height: 28px; padding: 0 10px; background: transparent; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font: inherit; font-size: 12px">Disconnect</button>
</div>
</div>

<div style="flex: 1; display: flex; flex-direction: column; min-height: 480px; padding: 12px 14px; box-sizing: border-box; overflow-x: auto; background: #010409; border: 2px solid #f85149; font-family: 'Cascadia Mono', ui-monospace, Consolas, monospace; font-size: 14px; line-height: 1.35; color: #c9d1d9">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="18">
<div style="white-space: pre; min-height: 19px"><span style="color: #3fb950">{{l.p}}</span><span style="color: {{l.c}}">{{l.t}}</span></div>
</sc-for>
<div style="white-space: pre"><span style="color: #3fb950">john@web-prod</span>:<span style="color: #58a6ff">~</span>$ <span style="display: inline-block; width: 9px; height: 17px; vertical-align: text-bottom; background: #c9d1d9"></span></div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
var G = '#3fb950', X = '#6e7681', R = '#f85149', T = '#c9d1d9', M = '#8b949e';
var host = function (name, addr, color, up, extra) {
var o = { isHost: true, isHead: false, name: name, addr: addr, color: color, dot: up ? G : X, dotFill: up ? G : 'transparent', key: true, pw: false, open: 0, bg: 'transparent' };
for (var k in (extra || {})) o[k] = extra[k];
return o;
};
var head = function (label, count) { return { isHead: true, isHost: false, label: label, count: count }; };
var out = function (t, c) { return { p: '', t: t, c: c || T }; };
var cmd = function (t) { return { p: 'john@web-prod', t: ':~$ ' + t, c: T }; };
return {
rows: [
head('Pinned', 2),
host('build-box', 'john@192.168.10.20', '#2f81f7', true),
host('web-prod', 'john@192.168.10.42', R, true, { open: 2, bg: '#1c2129' }),
head('Office LAN', 2),
host('backup-nas', 'admin@192.168.10.60', '#a371f7', true),
host('print-srv', 'root@192.168.10.15', '#8b949e', false, { key: false, pw: true }),
head('Appliances', 2),
host('imaging-01', 'admin@192.168.10.31:2222', '#d29922', true, { open: 1 }),
host('parser-vm', 'root@192.168.10.27', '#d29922', true),
head('VPN', 1),
host('vpn-gw', 'john@10.8.0.1', '#3fb950', false)
],
lines: [
out('Welcome to Ubuntu 24.04.1 LTS (GNU/Linux 6.8.0-48-generic x86_64)'),
out(''),
out('Last login: Fri Nov 13 14:02:11 2026', M),
cmd('docker compose ps'),
out('NAME         IMAGE                  STATUS        PORTS'),
out('web-app      web-app:latest         Up 6 days     0.0.0.0:5000->5000/tcp'),
out('web-nginx    nginx:1.27             Up 6 days     0.0.0.0:80->80/tcp'),
cmd('df -h /'),
out('Filesystem      Size  Used Avail Use% Mounted on'),
out('/dev/sda2       234G   61G  162G  28% /'),
cmd('systemctl is-active ssh'),
out('active', G),
cmd('uptime'),
out(' 14:14:37 up 6 days,  2:41,  1 user,  load average: 0.08, 0.05, 0.01')
]
};
}
}
</script>
</body>
</html>
